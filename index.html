<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Us — shared dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="home">
    <p class="home-eyebrow">shared dashboard</p>
    <h1 class="home-title">us.</h1>
    <p class="home-sub">Pick a side, or the middle.</p>

    <div class="venn-wrap">
      <svg viewBox="0 0 520 360" role="img" aria-label="Choose Me, GF, or Both">
        <defs>
          <clipPath id="clipGF">
            <circle cx="335" cy="180" r="130" />
          </clipPath>
        </defs>

        <a href="list.html?section=me" class="venn-link" aria-label="Go to Me's lists">
          <circle class="venn-shape venn-circle-me" cx="185" cy="180" r="130" fill="#3e7c7b" />
        </a>

        <a href="list.html?section=gf" class="venn-link" aria-label="Go to GF's lists">
          <circle class="venn-shape venn-circle-gf" cx="335" cy="180" r="130" fill="#c1546b" />
        </a>

        <a href="list.html?section=both" class="venn-link" aria-label="Go to shared lists">
          <circle class="venn-shape venn-lens" cx="185" cy="180" r="130" clip-path="url(#clipGF)" fill="#7d5f8f" />
        </a>

        <text x="130" y="188" class="venn-label" font-size="26" text-anchor="middle">Me</text>
        <text x="390" y="188" class="venn-label" font-size="26" text-anchor="middle">GF</text>
        <text x="260" y="184" class="venn-label-both" font-size="15" text-anchor="middle">Both</text>
      </svg>
    </div>

    <p class="home-foot">Lists save to this browser. Tap a circle to open one.</p>
  </main>
</body>
</html>
